[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenengine"
version = "0.7.1"
description = "A private, spatial and expressive music-lighting engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Private project - all rights reserved"}
authors = [{name = "David Mack"}]
dependencies = ["numpy>=2.3,<3"]

[project.optional-dependencies]
tty = ["pyserial>=3.5"]

[project.scripts]
lumen = "lumen_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
